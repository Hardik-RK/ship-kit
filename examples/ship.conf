# ship.conf: sourced by `ship` as bash, so treat it like code you wrote.
# Live at $SHIP_ROOT/ship.conf (or pass --config).

SERVICE=myapp                                  # systemd unit
HEALTH_URL=http://127.0.0.1:8080/health        # must return 2xx JSON; smoke paths are relative to this URL's directory
HEALTH_VERSION_FIELD=version                   # JSON field that must equal the release's manifest version
HEALTH_TIMEOUT=30                              # seconds to wait for health after the restart
HEALTH_INTERVAL=1

# SYSTEMCTL="sudo systemctl"                   # if the deploy user is not root (see examples/sudoers.d-ship)

DB_PATH=/srv/myapp/shared/data/app.sqlite      # leave empty if the app has no database
DB_KIND=sqlite                                 # sqlite = online backup + integrity_check; file = plain copy (idle app only)
# BACKUP_DIR=/srv/myapp/shared/backups         # default: $SHIP_ROOT/shared/backups
BACKUP_KEEP=10
KEEP_RELEASES=5

# Run inside the new release directory, once against a COPY of the DB (rehearsal), then against
# the live DB with the service stopped. Receives SHIP_DB_PATH, SHIP_RELEASE_DIR, SHIP_RELEASE_VERSION.
# It runs only when the release's schema_version differs from the current release's.
MIGRATE_CMD='node migrate.js'

# What to do with the database if a deploy fails after the switch:
#   if-migrated  restore the pre-deploy backup only if a migration ran (default)
#   always       always restore
#   never        never restore (old code may not run against a migrated schema; ship will say so)
ROLLBACK_RESTORE_DB=if-migrated

SMOKE_FILE=/srv/myapp/smoke.txt                # see examples/smoke.txt

# Optional hooks, run inside the new release directory.
# PRE_SWITCH_HOOK='caddy validate --config /etc/caddy/Caddyfile'    # failure aborts before anything changes
# POST_SUCCESS_HOOK='caddy reload --config /etc/caddy/Caddyfile'    # failure only warns
