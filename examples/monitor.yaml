# ship-kit monitor: example configuration (YAML subset; JSON works too, see monitor.json).
# Run once from cron:   node monitor/src/cli.ts watch --config examples/monitor.yaml --once
# See what it would say: node monitor/src/cli.ts self-test --config examples/monitor.yaml
name: demo-app
intervalSeconds: 60
stateFile: /var/lib/ship-monitor/state.json    # lets --once remember between cron runs
statusFile: /var/lib/ship-monitor/status.json  # tiny status page, rewritten every run

alerting:
  failAfter: 2         # consecutive bad readings before the first alert (damps one-off blips)
  recoverAfter: 2      # consecutive good readings before "recovered"
  repeatMinutes: 120   # remind about a still-broken check; 0 = never
  flap:
    threshold: 4       # this many status changes ...
    windowMinutes: 30  # ... inside this window = "flapping": one notice, then quiet

notifiers:
  - type: webhook      # Slack/Discord-style incoming webhook or your own endpoint
    url: https://hooks.example.invalid/services/XXXX
  - type: telegram
    tokenEnv: TELEGRAM_BOT_TOKEN   # the token is read from this environment variable
    chatId: "123456789"
  - type: email
    host: smtp.example.invalid
    port: 587
    starttls: true
    user: alerts@example.invalid
    passEnv: SMTP_PASSWORD
    from: alerts@example.invalid
    to: [oncall@example.invalid]

checks:
  - name: health
    type: http
    url: http://127.0.0.1:8080/health
    expectStatus: 200
    warnLatencyMs: 500
    critLatencyMs: 2000
    json: {field: status, equals: ok}

  - name: tls-cert
    type: tls
    host: app.example.invalid
    warnDays: 21
    critDays: 7

  - name: root-disk
    type: disk
    path: /
    warnPercent: 80
    critPercent: 90
    inodeWarnPercent: 80
    inodeCritPercent: 90

  - name: service
    type: systemd
    unit: demo-app

  - name: db-backup
    type: backup
    dir: /srv/demo/shared/backups
    pattern: '\.bak$'
    requireMarker: true     # only count backups ship has verified (a .bak.ok sidecar exists)
    warnHours: 26
    critHours: 50

  - name: app-errors
    type: lograte
    file: /var/log/demo-app/app.log
    windowMinutes: 10
    warnCount: 5
    critCount: 20
    warnRatePercent: 5
    critRatePercent: 20
